<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="A modern, responsive calculator app built with HTML, CSS, and JavaScript"><meta name="theme-color" content="#000000"><title>Calculator</title><link rel="preload" href="style.css" as="style"><link rel="preload" href="main.js" as="script"><link rel="dns-prefetch" href="//fonts.googleapis.com"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0;padding:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);font-display:swap}#calculator{background-color:#000;border-radius:20px;width:min(90vw,400px);box-shadow:0 20px 40px rgba(0,0,0,0.3);overflow:hidden;transform:translateZ(0);will-change:transform}#display{width:100%;height:120px;border:none;background-color:#000;color:#fff;font-size:clamp(2rem,8vw,4rem);font-weight:300;text-align:right;padding:0 20px;text-rendering:optimizeSpeed;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;outline:none;resize:none}#keys{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background-color:#333;padding:1px}button{border:none;background-color:#666;color:#fff;font-size:clamp(1.2rem,4vw,1.8rem);font-weight:600;height:80px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transform:translateZ(0);transition:background-color 0.15s ease,transform 0.1s ease;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}button:hover{background-color:#777}button:active{transform:scale(0.95);background-color:#555}button[data-action="operator"]{background-color:#ff9500}button[data-action="operator"]:hover{background-color:#ffad33}button[data-action="operator"]:active{background-color:#cc7700}button[data-action="clear"]{background-color:#a6a6a6;color:#000}button[data-action="clear"]:hover{background-color:#bfbfbf}.equals{background-color:#ff9500 !important;grid-column:span 2}.equals:hover{background-color:#ffad33 !important}button[data-value="0"]{grid-column:span 2}button:focus-visible{outline:2px solid #fff;outline-offset:-2px}#display:focus-visible{outline:2px solid #ff9500;outline-offset:-2px}@media (max-width:480px){#calculator{width:95vw;border-radius:15px}#display{height:100px;padding:0 15px}button{height:70px;font-size:1.4rem}}@media (max-width:320px){button{height:60px;font-size:1.2rem}#display{height:80px;font-size:2.5rem}}@media (-webkit-min-device-pixel-ratio:2),(min-resolution:192dpi){button{-webkit-font-smoothing:subpixel-antialiased}}@media (prefers-reduced-motion:reduce){*{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important}button{transition:none}}@media (prefers-color-scheme:dark){body{background:linear-gradient(135deg,#2c3e50 0%,#34495e 100%)}}@media print{body{background:#fff}#calculator{box-shadow:none;border:1px solid #000}}</style></head><body><main><div id="calculator" role="application" aria-label="Calculator"><input 
                id="display" 
                type="text"
                readonly 
                aria-label="Calculator display"
                aria-live="polite"
                autocomplete="off"
                inputmode="none"><div id="keys" role="grid" aria-label="Calculator buttons"><button type="button" data-action="operator" data-value="+" aria-label="Plus">+</button><button type="button" data-action="operator" data-value="-" aria-label="Minus">-</button><button type="button" data-action="operator" data-value="*" aria-label="Multiply">×</button><button type="button" data-action="operator" data-value="/" aria-label="Divide">÷</button><button type="button" data-action="number" data-value="7" aria-label="Seven">7</button><button type="button" data-action="number" data-value="8" aria-label="Eight">8</button><button type="button" data-action="number" data-value="9" aria-label="Nine">9</button><button type="button" data-action="clear" aria-label="Clear">C</button><button type="button" data-action="number" data-value="4" aria-label="Four">4</button><button type="button" data-action="number" data-value="5" aria-label="Five">5</button><button type="button" data-action="number" data-value="6" aria-label="Six">6</button><button type="button" data-action="operator" data-value="(" aria-label="Open parenthesis">(</button><button type="button" data-action="number" data-value="1" aria-label="One">1</button><button type="button" data-action="number" data-value="2" aria-label="Two">2</button><button type="button" data-action="number" data-value="3" aria-label="Three">3</button><button type="button" data-action="operator" data-value=")" aria-label="Close parenthesis">)</button><button type="button" data-action="number" data-value="0" aria-label="Zero">0</button><button type="button" data-action="decimal" data-value="." aria-label="Decimal point">.</button><button type="button" data-action="calculate" aria-label="Equals" class="equals">=</button></div></div></main><script>class Calculator{constructor(){this.display=document.getElementById("display");this.keys=document.getElementById("keys");this.currentInput="";this.lastResult=null;this.keys.addEventListener("click",this.handleButtonClick.bind(this));document.addEventListener("keydown",this.handleKeydown.bind(this));this.display.value="0";}handleButtonClick(event){const button=event.target.closest("button");if(!button)return;const action=button.dataset.action;const value=button.dataset.value;button.style.transform="scale(0.95)";requestAnimationFrame(()=>{button.style.transform="";});switch(action){case "number": this.appendToDisplay(value);break;case "operator": this.appendToDisplay(value);break;case "decimal": this.handleDecimal();break;case "clear": this.clearDisplay();break;case "calculate": this.calculate();break;}}handleKeydown(event){const key=event.key;if(/[\d+\-*/.()=]/.test(key)||key==="Enter"||key==="Escape"||key==="Backspace"){event.preventDefault();}if(/\d/.test(key)){this.appendToDisplay(key);}else if(["+","-","*","/","(",")"].includes(key)){this.appendToDisplay(key);}else if(key==="."){this.handleDecimal();}else if(key==="Enter"||key==="="){this.calculate();}else if(key==="Escape"||key==="c"||key==="C"){this.clearDisplay();}else if(key==="Backspace"){this.backspace();}}appendToDisplay(input){if(this.display.value==="0"||this.display.value==="Error"){this.display.value=input;}else{const lastChar=this.display.value.slice(-1);const operators=["+","-","*","/"];if(operators.includes(input)&&operators.includes(lastChar)){this.display.value=this.display.value.slice(0,-1)+input;}else{this.display.value+=input;}}this.currentInput=this.display.value;}handleDecimal(){const value=this.display.value;const segments=value.split(/[+\-*/]/);const currentSegment=segments[segments.length-1];if(!currentSegment.includes(".")){if(value==="0"||value==="Error"){this.display.value="0.";}else{this.display.value+=".";}this.currentInput=this.display.value;}}clearDisplay(){this.display.value="0";this.currentInput="";this.lastResult=null;}backspace(){if(this.display.value.length>1&&this.display.value!=="Error"){this.display.value=this.display.value.slice(0,-1);}else{this.display.value="0";}this.currentInput=this.display.value;}calculate(){try{const expression=this.display.value;if(!this.isValidExpression(expression)){throw new Error("Invalid expression");}const result=this.safeEvaluate(expression);if(!isFinite(result)){throw new Error("Invalid result");}const formattedResult=this.formatResult(result);this.display.value=formattedResult;this.lastResult=result;}catch(error){this.display.value="Error";console.error("Calculation error:",error);}}isValidExpression(expr){const allowedChars=/^[\d+\-*/.()]+$/;if(!allowedChars.test(expr))return false;let openParens=0;for(const char of expr){if(char==="(")openParens++;if(char===")")openParens--;if(openParens<0)return false;}return openParens===0;}safeEvaluate(expression){const jsExpression=expression .replace(/×/g,"*").replace(/÷/g,"/");const allowedNames=["Math","Number","parseInt","parseFloat"];const context={};allowedNames.forEach(name=>{context[name]=window[name];});const func=new Function(...Object.keys(context),`"use strict";return(${jsExpression});`);return func(...Object.values(context));}formatResult(num){const rounded=Math.round((num+Number.EPSILON)*100000000)/100000000;let result=rounded.toString();if(result.includes(".")&&result.split(".")[1].length>8){result=rounded.toFixed(8).replace(/\.?0+$/,"");}return result;}}document.addEventListener("DOMContentLoaded",()=>{new Calculator();});if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",()=>new Calculator());}else{new Calculator();}</script></body></html>
